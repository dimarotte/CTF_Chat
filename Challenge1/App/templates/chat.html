<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}" />
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">Direct Messages</div>
        <div class="dm-list" id="dmList"></div>
        <button class="new-dm-btn" onclick="openModal('dm')">+ New Message</button>
        <button class="new-dm-btn" onclick="openModal('flag')">Flag</button>
        <div class="user-bar">
            <span class="username">{{ user }}</span>
            <a href="/logout">logout</a>
        </div>
    </div>

    <div class="main" id="mainArea">
        <div class="main-empty">
            <p>No conversation selected.</p>
            <span>Start a new message or select one.</span>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2></h2>
            <input type="text" id="targetUsername" placeholder="" autocomplete="off" />
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-confirm" onclick="confirmModal()"></button>
            </div>
        </div>
    </div>

    <script>
        const ME = "{{ user }}";
    </script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>

</html>
